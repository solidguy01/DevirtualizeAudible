name: build

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Squash merges use the PR title as the commit message on main
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title is not a Conventional Commit: $TITLE"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./build.sh
      # Errors fail the job; warnings are only reported
      - run: npm run lint
      # Each artifact downloads as a zip of the unpacked extension
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-chrome
          path: dist/chrome/
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-firefox
          path: dist/firefox/

  # End-to-end tests of both builds in Chromium and Firefox (see playwright.config.js)
  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      # Keep in sync with @playwright/test in package.json
      image: dhi.io/playwright:1.64.1-debian13-dev
      credentials:
        username: ${{ secrets.DHI_USERNAME }}
        password: ${{ secrets.DHI_TOKEN }}
      options: --ipc=host --init
    env:
      # Firefox refuses to run as root with a HOME owned by another user
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: devirtualizeaudible-chrome
          path: dist/chrome
      - uses: actions/download-artifact@v4
        with:
          name: devirtualizeaudible-firefox
          path: dist/firefox
      - run: npm ci
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  # Derives the version from commits since the last tag, injects it, tags and releases
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          version=$(./next-version.sh)
          if [ -z "$version" ]; then
            echo "No feat, fix, perf or breaking commits since the last release"
            exit 0
          fi
          VERSION="$version" ./build.sh
          tag="v$version"
          mv dist/chrome.zip "dist/DevirtualizeAudible-chrome-$tag.zip"
          mv dist/firefox.zip "dist/DevirtualizeAudible-firefox-$tag.zip"
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
