name: build

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Squash merges use the PR title as the commit message on main
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title is not a Conventional Commit: $TITLE"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      # Each artifact downloads as a zip of the unpacked extension
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-chrome
          path: dist/chrome/
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-firefox
          path: dist/firefox/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(./build.sh)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
          mv dist/chrome.zip "dist/DevirtualizeAudible-chrome-$GITHUB_REF_NAME.zip"
          mv dist/firefox.zip "dist/DevirtualizeAudible-firefox-$GITHUB_REF_NAME.zip"
          gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
