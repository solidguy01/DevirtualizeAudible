name: build

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Squash merges use the PR title as the commit message on main
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "PR title is not a Conventional Commit: $TITLE"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      # Each artifact downloads as a zip of the unpacked extension
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-chrome
          path: dist/chrome/
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-firefox
          path: dist/firefox/

  # Tags and releases v<manifest version> on main unless that release already exists
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="v$(./build.sh)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already released; bump the manifest versions to release"
            exit 0
          fi
          mv dist/chrome.zip "dist/DevirtualizeAudible-chrome-$tag.zip"
          mv dist/firefox.zip "dist/DevirtualizeAudible-firefox-$tag.zip"
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
