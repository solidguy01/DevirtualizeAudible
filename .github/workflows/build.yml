name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      # Each artifact downloads as a zip of the unpacked extension
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-chrome
          path: dist/chrome/
      - uses: actions/upload-artifact@v4
        with:
          name: devirtualizeaudible-firefox
          path: dist/firefox/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: |
          mv dist/chrome.zip "dist/DevirtualizeAudible-chrome-$GITHUB_REF_NAME.zip"
          mv dist/firefox.zip "dist/DevirtualizeAudible-firefox-$GITHUB_REF_NAME.zip"
          gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
